# CI: build + test the etal compiler on all supported platforms.
#
# Notes:
# - etal.opam.locked pins exact versions for LOCAL use; CI resolves
#   fresh ranges from etal.opam on every OS (per setup-ocaml's own
#   recommendation), because the lockfile records ocaml-system, which
#   exists on no GitHub runner (locked installs fail with an
#   unsatisfiable ocaml-system constraint).
# - Behavioural gates need no VM: `etal -t` stops before assembly, so
#   the golden .tal diff proves host-independent codegen everywhere.
# - VM-dependent gates (ROM runs, portability.sh) stay local: uxn2/
#   is a separate checkout, the portability gate is ELF-specific, and
#   stock runners lack SDL2 (the vendored VM can't even boot there;
#   use tests/portability.sh on a dev machine instead).
# - Windows uses OCaml "5.3" (range): plain 5.5.0/5.3.0 have no Windows
#   base-compiler package in opam-repository, while >= 5.3 is supported
#   on all OSes per the setup-ocaml matrix. Quoted: YAML parses
#   unquoted 5.10 as float 5.1 (action README warning).
# - Linux disables sandboxing (bubblewrap isn't guaranteed on runners);
#   pure-OCaml builds need nothing systemic anywhere. (An older failure
#   blamed on darcs vanished with the setup-ocaml v2->v3 bump; current
#   setup-ocaml has no opam-depext input at all.)
# - No dune-cache input: deprecated upstream in favour of the default
#   cache behaviour; the compiler switch itself is still cached by the
#   action, and project deps intentionally re-resolve every run.
# - Every `run:` below uses bash (also present on the windows runner
#   via Git for Windows).

name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  etal:
    name: etal (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ocaml: "5.5.0"
            nosandbox: true
          - name: macos
            os: macos-latest
            ocaml: "5.5.0"
            nosandbox: false
          - name: windows
            os: windows-latest
            ocaml: "5.3"
            nosandbox: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-disable-sandboxing: ${{ matrix.nosandbox }}

      - name: Install dependencies
        run: opam install --deps-only -y .

      - name: Build
        run: opam exec -- dune build @all

      - name: Unit probes
        run: opam exec -- dune runtest

      - name: Golden .tal diff (host-independent codegen)
        # NOTE: output must be repo-relative, not /tmp/.... The etal
        # binary is native per-OS: on Windows /tmp/ means C:\tmp, which
        # does not exist (Sys_error creating it). Repo root always exists.
        run: |
          opam exec -- dune exec -- etal -t tests/ci.ux -o ci.actual.tal
          echo "expected lines: $(wc -l < tests/ci_expected.tal) / actual lines: $(wc -l < ci.actual.tal)"
          diff -u tests/ci_expected.tal ci.actual.tal && echo GOLDEN-OK

      - name: Upload compiler artifact (tags only)
        # The release job consumes this instead of rebuilding: same
        # bytes CI validated, no second toolchain provisioning.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: etal-${{ matrix.name }}
          path: _build/default/src/bin/etal.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload actual output on golden failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: actual-tal-${{ matrix.name }}
          path: ci.actual.tal

  release:
    # Compiler-only releases (no games): each artifact is the etal
    # binary plus the vendor/ tree (VMs, assembler, web emulator), so
    # -r/bundle/web work out of the box wherever that OS's VM row
    # exists (today: linux; macOS/Windows light up when their VM
    # binaries land in vendor/).
    # No toolchain here: the binary comes from the etal job's artifact
    # (same bytes CI validated), so release needs no OCaml/opam/dune.
    name: release (${{ matrix.asset }})
    needs: [etal]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            asset: etal-linux-x86_64.tar.gz
          - name: macos
            os: macos-latest
            asset: etal-macos-arm64.tar.gz
          - name: windows
            os: windows-latest
            asset: etal-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download compiler artifact
        uses: actions/download-artifact@v5
        with:
          name: etal-${{ matrix.name }}
          path: pkg

      - name: Stage package (compiler + vendor tree)
        run: |
          test -f pkg/etal.exe || { echo "compiler artifact missing in pkg/:"; ls -R pkg; exit 1; }
          cp -r vendor pkg/vendor
          ls -R pkg | head -n 12

      - name: Pack archive (unix)
        # NOTE: the binary keeps dune's uniform `etal.exe` name on all
        # OSes (runs fine everywhere, zero rename fragility).
        if: matrix.name != 'windows'
        run: tar -czf ${{ matrix.asset }} -C pkg etal.exe vendor

      - name: Pack archive (windows)
        if: matrix.name == 'windows'
        run: powershell.exe -NoProfile -Command "Compress-Archive -Path pkg\\etal.exe,pkg\\vendor -DestinationPath ${{ matrix.asset }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
