# CI: build + test the etal compiler on all supported platforms.
#
# Notes:
# - etal.opam.locked pins exact Linux versions; macOS/Windows install
#   the same ranges from etal.opam (ocaml >= 5.0, dune 3.24.x) because
#   the lockfile records ocaml-system (Linux-only).
# - Behavioural gates need no VM: `etal -t` stops before assembly, so
#   the golden .tal diff proves host-independent codegen everywhere.
# - VM-dependent gates (ROM runs, portability.sh) stay local: uxn2/
#   is a separate checkout and the portability gate is ELF-specific.
#   The linux job additionally runs portability.sh against vendor/.
# - Windows uses OCaml "5.3" (range): plain 5.5.0/5.3.0 have no Windows
#   base-compiler package in opam-repository, while >= 5.3 is supported
#   on all OSes per the setup-ocaml matrix. Quoted: YAML parses
#   unquoted 5.10 as float 5.1 (action README warning).
# - Linux sets opam-depext: false: opam's default depext set includes
#   darcs, which no longer exists on Ubuntu noble, failing the whole
#   apt install. We need nothing from apt (pure OCaml: the compiler
#   comes from setup-ocaml, dune from opam), so depext is skipped and
#   sandboxing disabled with it (bubblewrap came from the same set).
#   macOS keeps depext (brew path works there).
# - Every `run:` below uses bash (also present on the windows runner
#   via Git for Windows).

name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  etal:
    name: etal (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ocaml: "5.5.0"
            depext: false
            nosandbox: true
          - name: macos
            os: macos-latest
            ocaml: "5.5.0"
            depext: true
            nosandbox: false
          - name: windows
            os: windows-latest
            ocaml: "5.3"
            depext: true
            nosandbox: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-depext: ${{ matrix.depext }}
          opam-disable-sandboxing: ${{ matrix.nosandbox }}

      - name: Install locked dependencies (linux)
        if: matrix.name == 'linux'
        run: opam install --locked --deps-only -y .

      - name: Install dependencies (macOS, Windows)
        if: matrix.name != 'linux'
        run: opam install --deps-only -y .

      - name: Build
        run: opam exec -- dune build @all

      - name: Unit probes
        run: opam exec -- dune runtest

      - name: Golden .tal diff (host-independent codegen)
        run: |
          opam exec -- dune exec -- etal -t tests/ci.ux -o /tmp/ci.actual.tal
          diff tests/ci_expected.tal /tmp/ci.actual.tal && echo GOLDEN-OK

      - name: Portability gate (Linux VM contract)
        if: matrix.name == 'linux'
        run: sh tests/portability.sh
