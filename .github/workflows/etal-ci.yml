# etal-ci: build + test the etal compiler on all supported platforms, then
# package tag releases.
#
# Notes:
# - etal.opam.locked pins exact versions for LOCAL use; CI resolves
#   fresh ranges from etal.opam on every OS (per setup-ocaml's own
#   recommendation), because the lockfile records ocaml-system, which
#   exists on no GitHub runner (locked installs fail with an
#   unsatisfiable ocaml-system constraint).
# - Behavioural gates need no VM: `etal -t` stops before assembly, so
#   the golden .tal diff proves host-independent codegen everywhere.
# - VM-dependent gates (ROM assembly via tests/smoke.sh, ROM runs,
#   portability.sh) stay local: uxn2/ is a separate checkout, the
#   portability gate is ELF-specific, and stock runners lack SDL2 (the
#   vendored VM can't even boot there; run tests/smoke.sh and
#   tests/portability.sh on a dev machine instead).
# - Windows uses OCaml "5.3" (range): plain 5.5.0/5.3.0 have no Windows
#   base-compiler package in opam-repository, while >= 5.3 is supported
#   on all OSes per the setup-ocaml matrix. Quoted: YAML parses
#   unquoted 5.10 as float 5.1 (action README warning).
# - Linux disables sandboxing (bubblewrap isn't guaranteed on runners);
#   pure-OCaml builds need nothing systemic anywhere. (An older failure
#   blamed on darcs vanished with the setup-ocaml v2->v3 bump; current
#   setup-ocaml has no opam-depext input at all.)
# - No dune-cache input: deprecated upstream in favour of the default
#   cache behaviour; the compiler switch itself is still cached by the
#   action, and project deps intentionally re-resolve every run.
# - Every `run:` below uses bash (also present on the windows runner
#   via Git for Windows).

name: etal-ci

on:
  # dev branch pushes skip CI (push freely while iterating); CI runs on
  # main pushes, version tags (releases) and any pull request, so opening
  # a PR from dev still gates before merge.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Manual runs also build the per-OS game VMs (to try them without
  # tagging a release).
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test etal (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ocaml: "5.5.0"
            nosandbox: true
          - name: linux-arm
            os: ubuntu-24.04-arm
            ocaml: "5.5.0"
            nosandbox: true
          - name: macos
            os: macos-latest
            ocaml: "5.5.0"
            nosandbox: false
          - name: windows
            os: windows-latest
            ocaml: "5.3"
            nosandbox: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up OCaml toolchain
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-disable-sandboxing: ${{ matrix.nosandbox }}

      - name: Install etal opam dependencies
        run: opam install --deps-only -y .

      - name: Build etal compiler
        run: opam exec -- dune build @all

      - name: Run etal unit probes
        run: opam exec -- dune runtest

      - name: Golden .tal diff (host-independent codegen)
        # NOTE: output must be repo-relative, not /tmp/.... The etal
        # binary is native per-OS: on Windows /tmp/ means C:\tmp, which
        # does not exist (Sys_error creating it). Repo root always exists.
        run: |
          opam exec -- dune exec -- etal -t tests/ci.ux -o ci.actual.tal
          echo "expected lines: $(wc -l < tests/ci_expected.tal) / actual lines: $(wc -l < ci.actual.tal)"
          diff -u tests/ci_expected.tal ci.actual.tal && echo GOLDEN-OK

      - name: Stage validated etal binary (tags only)
        # Flatten first: upload-artifact v4+ preserves the build/*/
        # layout inside artifacts (so pkg/ would nest as
        # pkg/<platform>/etal and break staging). One of the two
        # copies below matches per runner; the other is absent.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          rm -rf stage && mkdir stage
          cp build/*/etal stage/ 2>/dev/null || true
          cp build/*/etal.exe stage/ 2>/dev/null || true
          ls stage/

      - name: Upload validated etal binary (tags only)
        # The package-release job consumes this instead of rebuilding: same
        # bytes CI validated, no second toolchain provisioning.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          # Flat: stage/ holds just the binary, so the artifact root
          # is pkg/etal[.exe] after download (see staging above).
          name: etal-${{ matrix.name }}
          path: stage/
          if-no-files-found: error
          retention-days: 7

      - name: Upload actual .tal on golden failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: actual-tal-${{ matrix.name }}
          path: ci.actual.tal

  build-vm:
    # The game VM (uxn2) for the OSes this Linux dev box can't build:
    # GitHub's own macOS and Windows runners compile it, so no Mac or
    # Windows machine is needed. Same source everywhere (upstream uxn2
    # pinned below), same release intent as vendor/linux-x86_64
    # (-DNDEBUG -O2, stripped, SDL2 dynamic). See vendor/BUILD.md.
    name: build-vm uxn2 (${{ matrix.row }})
    # Every push to main and every tag (not PRs): a broken VM build
    # shows up right away instead of at release time.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: linux-aarch64
            os: ubuntu-24.04-arm
          - row: macos-arm64
            os: macos-latest
          - row: macos-x86_64
            os: macos-15-intel
          - row: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      UXN2_REPO: https://git.sr.ht/~rabbits/uxn2
      UXN2_COMMIT: 8794ea557cdf282968d3e0fc93714840a42b245c
    steps:
      - name: Fetch uxn2 source (pinned commit)
        run: |
          git clone --quiet "$UXN2_REPO" uxn2src
          git -C uxn2src checkout --quiet "$UXN2_COMMIT"

      - name: Build uxn2 (Linux arm64, distro SDL2)
        # For ARM Linux servers (the backend on Graviton assembles with
        # the host row) and ARM players. Built on Ubuntu 24.04, so it
        # needs glibc 2.39+ (the x86_64 row keeps its 2.17 floor).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsdl2-dev
          mkdir -p out
          cc $(sdl2-config --cflags) -DNDEBUG -O2 -g0 uxn2src/src/uxn2.c -o out/uxn2 $(sdl2-config --libs)
          strip out/uxn2
          file out/uxn2
          ./out/uxn2 -v

      - name: Build uxn2 (macOS, Homebrew SDL2)
        # Links Homebrew's libSDL2 (/opt/homebrew on Apple silicon,
        # /usr/local on Intel): players `brew install sdl2`, which the
        # bundle stub already tells them. Ad-hoc signed so it runs.
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          mkdir -p out
          cc $(sdl2-config --cflags) -DNDEBUG -O2 -g0 uxn2src/src/uxn2.c -o out/uxn2 $(sdl2-config --libs)
          strip out/uxn2
          codesign --force -s - out/uxn2
          file out/uxn2
          otool -L out/uxn2
          ./out/uxn2 -v

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

      - name: Build uxn2.exe (Windows, MinGW + SDL2.dll beside it)
        # The zip carrier co-ships SDL2.dll from the row dir, so
        # players need nothing installed (Windows loads DLLs next to
        # the exe).
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p out
          gcc $(sdl2-config --cflags) -DNDEBUG -O2 -g0 -s uxn2src/src/uxn2.c -o out/uxn2.exe $(sdl2-config --libs)
          cp /mingw64/bin/SDL2.dll out/
          file out/uxn2.exe
          ldd out/uxn2.exe | grep -iv '/c/windows' || true

      - name: Upload VM
        uses: actions/upload-artifact@v5
        with:
          name: vm-${{ matrix.row }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    # Compiler-only releases (no games): each artifact is the etal
    # binary plus the vendor/ tree (VMs, assembler, web emulator), so
    # -r/bundle/web work out of the box wherever that OS's VM row
    # exists (linux-x86_64 and macos-arm64 are committed; linux-aarch64,
    # macos-x86_64 and Windows come from build-vm).
    # No toolchain here: the binary comes from the build-test job's artifact
    # (same bytes CI validated), so release needs no OCaml/opam/dune.
    name: package-release etal (${{ matrix.asset }})
    needs: [build-test, build-vm]
    # A VM that fails to build (one OS) must not block the compiler
    # release: that row just stays unvendored ("coming soon").
    if: ${{ !cancelled() && needs.build-test.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            asset: etal-linux-x86_64.tar.gz
          - name: linux-arm
            os: ubuntu-24.04-arm
            asset: etal-linux-aarch64.tar.gz
          - name: macos
            os: macos-latest
            asset: etal-macos-arm64.tar.gz
          - name: windows
            os: windows-latest
            asset: etal-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download validated etal binary
        uses: actions/download-artifact@v5
        with:
          name: etal-${{ matrix.name }}
          path: pkg

      - name: Download the per-OS game VMs
        uses: actions/download-artifact@v5
        with:
          pattern: vm-*
          path: vms

      - name: Vendor the fresh VMs (every package carries every OS)
        # A Linux backend with this release can then build macOS and
        # Windows downloads too: bundling only packages a VM next to
        # the ROM. Artifacts drop the exec bit, so restore it.
        run: |
          for d in vms/vm-*; do
            [ -d "$d" ] || continue
            row="${d#vms/vm-}"
            mkdir -p "vendor/$row"
            cp -R "$d"/. "vendor/$row/"
            chmod +x "vendor/$row"/uxn2* || true
          done
          ls -R vendor | head -n 40

      - name: Stage release package (compiler + vendor tree)
        run: |
          ls pkg/etal 2>/dev/null || ls pkg/etal.exe 2>/dev/null || { echo "compiler artifact missing in pkg/:"; ls -R pkg; exit 1; }
          cp -r vendor pkg/vendor
          cp -r web pkg/web
          ls -R pkg | head -n 12

      - name: Pack unix release archive
        # NOTE: extensionless on unix (`etal`), `.exe` on Windows —
        # each platform's conventional executable name.
        if: matrix.name != 'windows'
        run: tar -czf ${{ matrix.asset }} -C pkg etal vendor web

      - name: Pack windows release archive
        if: matrix.name == 'windows'
        run: powershell.exe -NoProfile -Command "Compress-Archive -Path pkg\\etal.exe,pkg\\vendor,pkg\\web -DestinationPath ${{ matrix.asset }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
